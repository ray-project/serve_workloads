# Always-on baseline traffic generator for the serve-validation service.
# Holds a fixed number of in-flight requests per deployment (closed-loop: refill
# on completion) to keep each app exercised; the scheduled locust load tests run
# on top of this baseline. HTTP-only.
#
# Deploy (expand the token placeholder through envsubst, like the locust schedules):
#   export ANYSCALE_SERVICE_TOKEN=...   # serve-validation's bearer token
#   envsubst < baseline_pinger_service.yaml | anyscale service deploy -f -
#
# Tune pool size without editing code via BASELINE_DEFAULT_CONCURRENCY below
# (default 1 in flight per deployment).
name: serve-validation-baseline-pinger

project: serve-testing

image_uri: anyscale/ray:nightly-py310

working_dir: .

requirements: requirements.txt

compute_config:
  cloud: anyscale_v2_default_cloud
  head_node:
    # BaselinePinger runs num_cpus:2 (set in code): the single send loop holds
    # ~11 in-flight (1 per deployment) + body reads and needs dedicated cores.
    # m7i.xlarge (4 vCPU / 16 GiB): the earlier m7i.large downsize (2026-08-14)
    # ignored Ray's head-node daemons (GCS/raylet/dashboard ≈ 1+ core) on top
    # of the pinger loop — measured 80-83% CPU around the clock with 99.7%
    # peaks on 2 vCPU (2026-08-21). A near-saturated pinger delays its own
    # request timestamps and can fake latency/failure alerts, so 2 vCPU is
    # under the floor for measurement integrity. Keep
    # on-demand: this is the traffic source; a spot reclaim would fake a
    # zero-traffic gap on the service under test.
    instance_type: m7i.xlarge
    # Keep this head node out of the cloud GC reaper. Cloud Custodian's
    # gc-instances policy (anyscale/custodian, garbage-collection/policy.yaml,
    # deployed as lambda custodian-gc-instances in AWS 188439194153) stops every
    # running on-demand instance older than 12h that has no future
    # anyscale-expiration tag. It killed this head node on 2026-08-05 09:06Z and
    # 2026-08-12 08:06Z (CloudTrail StopInstances / Username
    # custodian-gc-instances); each kill is a ~96s zero-traffic gap on the
    # service under test, i.e. exactly the false signal the on-demand note above
    # is guarding against. ttl-hours is converted to anyscale-expiration by
    # tagging-lambda-dev-cloud_dogfood-run; the anyscale-user/anyscale-custodian
    # pair the policy also honours is unusable because ec2.ValidateTags rejects
    # any anyscale-prefixed key. Head node only, deliberately: this cluster has
    # no workers, and see anyscale_service.yaml for why its workers stay
    # reapable.
    advanced_instance_config:
      TagSpecifications:
        - ResourceType: instance
          Tags:
            - Key: ttl-hours
              Value: "8760"  # 1 year

env_vars:
  ANYSCALE_SERVICE_TOKEN: "${ANYSCALE_SERVICE_TOKEN}"
  BASELINE_DEFAULT_CONCURRENCY: "1"

applications:
  - name: baseline-pinger
    route_prefix: /
    import_path: baseline_pinger:build_app
    args:
      target_base_url: "https://serve-validation-bd88h.cld-kvedzwag2qa8i5bj.s.anyscaleuserdata-staging.com"
