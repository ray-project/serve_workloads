# Anyscale Service — deploy with:
#   anyscale service deploy -f anyscale_service.yaml -w .
# Override image: anyscale service deploy -f anyscale_service.yaml --image-uri other/image:tag -w .
# The image must resolve to a Cluster Environment build in your org (see console or `anyscale cluster-env list`).
# upgrade_service.py defaults --working-dir to the current directory.
#
# Schema: anyscale.service.models.ServiceConfig (CLI 0.26.x). Multi-resource
# compute_config + traffic_policy require CLI >= 0.26.115 (0.26.106 rejects the
# traffic_policy key). Ray Serve options that conflict with Anyscale-managed
# networking are omitted (host/port/proxy_location).
#
# MULTI-RESOURCE (2026-11-09): the service runs one full cluster per cloud
# resource of anyscale_v2_default_cloud — vm-aws-us-west-2 (VM),
# vm-gcp-us-east4 (VM) — with traffic split 3:1. A third resource, AWS EKS
# (k8s-aws-us-east-2), is BLOCKED until infra raises the staging EKS node
# group's ~20 GiB root volume to >= 100 GiB: the 7.8 GB cu128 nightly image
# cannot unpack there and the Ray pods churn disk-pressure eviction loops
# (attempt 2026-11-09, cluster ses_yfx4c3hvcy8c3xa6qlax8ebyy8). See the EKS
# TODO in compute_config.configs for the re-add recipe.
# Services do NOT fall back across resources (cloud_resource_strategy /
# cloud_resource_starting_timeout are jobs-only): every listed resource runs
# all apps below simultaneously and capacity follows traffic_policy. Health:
# Anyscale checks LB / cluster / Serve app per resource and moves that
# resource's share onto healthy peers while it is unhealthy.

name: serve-validation

project: serve-testing

image_uri: anyscale/ray:turbonightly-py310-cu128

working_dir: .

requirements: requirements.txt

compute_config:
  cloud: anyscale_v2_default_cloud
  configs:
    # ---------- AWS VM us-west-2: unchanged footprint ----------
    - cloud_resource: vm-aws-us-west-2
      head_node:
        # m7i.xlarge (4 vCPU / 16 GiB) per design §10.3 cost lever: measured head peak
        # (2026-08-02 run, 78 nodes) was 32% CPU / 3.2 GiB RSS on m7i.2xlarge. The
        # 75%/90% head-memory alerts guard this. Revert to m7i.2xlarge before genuine
        # 200-node / 4,096-replica full-scale runs.
        instance_type: m7i.xlarge
        # No schedulable CPU on head — Serve replicas and tasks go to workers only (design.md §3.1).
        resources:
          CPU: 0
        advanced_instance_config:
          TagSpecifications:
            - ResourceType: instance
              Tags:
                - Key: ttl-hours
                  Value: "8760"  # 1 year
      # ttl-hours on EVERY worker group (2026-09-14). The original plan left the spot
      # groups reapable ("they live well under the reaper's 12h floor at
      # min_nodes: 0"); that premise was false. Serve never moves replicas, so the
      # spot nodes that carry baseline replicas when a load test scales down live
      # until something kills them, and custodian-gc-instances-spot *terminates*
      # (not stops) every untagged spot instance older than 12h at :05 past the hour
      # (08-20 UTC). Four such kills so far (09-05, 09-06 x2, 09-13 08:05Z), each an
      # abrupt multi-node loss under live traffic: in-flight requests on the dead
      # nodes' HAProxies hang until the client gives up (ALB idle timeout is 3600s),
      # and any deployment whose replicas all sat on those nodes 503s until Serve
      # re-creates them. Leaked-worker backstop is now the instance manager's own
      # cluster termination plus the head node's lifetime, not the cost reaper.
      worker_nodes:
        # c6i.4xlarge (16 vCPU / 32 GiB, $0.68/h) replaces m5.4xlarge (16 vCPU /
        # 64 GiB, $0.768/h) — 2026-08-21 right-sizing: measured worker memory peak
        # across 24h incl. three load tests was 5.1 GiB (8% of 64), so RAM was the
        # wasted dimension; same core count keeps replica packing identical, and
        # c6i's Ice Lake cores are newer than m5's Skylake. -11.5% on every
        # worker-hour (~-$175/mo at current cadence).
        - name: cpu-general
          instance_type: c6i.4xlarge
          min_nodes: 0
          max_nodes: 150
          # PREFER_SPOT (design §3.1/§11, Risk 7). Depends on the compressed ladder
          # and warm floors in this branch -- do not revert this line on its own.
          market_type: PREFER_SPOT
          advanced_instance_config:
            TagSpecifications:
              - ResourceType: instance
                Tags:
                  - Key: ttl-hours
                    Value: "8760"  # 1 year
        - name: cpu-gpu-sim
          instance_type: c6i.4xlarge
          min_nodes: 0
          max_nodes: 49
          # PREFER_SPOT. Held back at first for mux, but the 20-model prewarm turned
          # out to be ~3s of a 30s startup, so mux is not special. This group carries
          # 93% of worker node-hours (the simulated_gpu: 8 cap packs 8 replicas onto
          # a 16-vCPU node), so it is where the ~$1,000/month of spot saving lives.
          market_type: PREFER_SPOT
          # Expose simulated_gpu on this group (logical resources on the node).
          resources:
            simulated_gpu: 8
          advanced_instance_config:
            TagSpecifications:
              - ResourceType: instance
                Tags:
                  - Key: ttl-hours
                    Value: "8760"  # 1 year
        # On-demand floor (2026-09-11). Three full-fleet spot reclaims overnight on
        # 09-11 took every worker at once and left the service at 0 healthy replicas
        # for ~45s each (all workers were c6i.4xlarge spot in one pool); the 60s drain
        # protected in-flight requests but new ones had no replica to land on. This
        # block holds the idle baseline (41 replicas fit on 2 nodes), so at idle the
        # autoscaler launches no spot and every baseline replica sits on capacity AWS
        # cannot reclaim; under load the spot types above carry the burst tier.
        # min == max: fixed block, never grows on-demand for load. Plain ON_DEMAND,
        # not PREFER_SPOT, so the 60-minute replacer leaves it alone.
        - name: cpu-gpu-sim-od
          instance_type: c6i.4xlarge
          min_nodes: 2
          max_nodes: 2
          market_type: ON_DEMAND
          resources:
            simulated_gpu: 8
          # Long-lived on-demand worker: exempt it from the 12h cost-GC reaper
          # (custodian-gc-instances stops untagged on-demand instances older than
          # 12h) the same way the head node is. Since 2026-09-14 the spot groups
          # carry the same tag -- see the note above worker_nodes.
          advanced_instance_config:
            TagSpecifications:
              - ResourceType: instance
                Tags:
                  - Key: ttl-hours
                    Value: "8760"  # 1 year
        # Second spot pool (2026-09-11). Same Ice Lake cores as c6i so P99
        # measurements stay comparable; one pool's reclaim no longer hits the whole
        # fleet, and it gives the replacer somewhere to land during the c6i.4xlarge
        # InsufficientInstanceCapacity stretches seen on 08-31.
        - name: cpu-gpu-sim-alt
          instance_type: m6i.4xlarge
          min_nodes: 0
          max_nodes: 49
          market_type: PREFER_SPOT
          resources:
            simulated_gpu: 8
          advanced_instance_config:
            TagSpecifications:
              - ResourceType: instance
                Tags:
                  - Key: ttl-hours
                    Value: "8760"  # 1 year

    # ---------- GCP VM us-east-4: added 2026-11-09 (multi-resource rollout) ----------
    - cloud_resource: vm-gcp-us-east4
      head_node:
        # n2-standard-4 (4 vCPU / 16 GiB) = direct GCP analog of m7i.xlarge.
        # Same no-schedulable-CPU-on-head rule (design.md §3.1).
        instance_type: n2-standard-4
        resources:
          CPU: 0
      worker_nodes:
        # n2-standard-16 (16 vCPU / 64 GiB, Ice Lake) = c6i.4xlarge analog for
        # this resource: same vCPU count so replica packing matches AWS (the
        # simulated_gpu: 8 cap, not RAM/CPU, is the binding constraint and worker
        # RAM peak was only 5.1 GiB in the measurements behind the -08-21
        # right-sizing). No ttl-hours tag: TagSpecifications is an EC2 concept and
        # the custodian reapers live in the AWS account only; revisit if a GCP GC
        # policy ever appears (labels via advanced_instance_config.instance_properties).
        # NOTE: PREFER_SPOT is AWS-only in Anyscale; GCP spot is plain SPOT with no
        # in-group on-demand fallback, so the on-demand floor below is what keeps
        # the idle baseline safe here (same reasoning as the 2026-09-11 AWS floor).
        - name: cpu-general
          instance_type: n2-standard-16
          min_nodes: 0
          max_nodes: 150
          market_type: SPOT
        - name: cpu-gpu-sim
          instance_type: n2-standard-16
          min_nodes: 0
          max_nodes: 49
          market_type: SPOT
          resources:
            simulated_gpu: 8
        # On-demand floor, mirroring cpu-gpu-sim-od: GCP (Spot/SPOT) instances are
        # also reclaim-capable within 30s notice, so the idle baseline needs a
        # fixed non-reclaimable block on this resource too.
        - name: cpu-gpu-sim-od
          instance_type: n2-standard-16
          min_nodes: 2
          max_nodes: 2
          market_type: ON_DEMAND
          resources:
            simulated_gpu: 8
        # Second spot pool analog: n2d = AMD (different machine family, like
        # m6i-vs-c6i on AWS), so one reclaim wave can't take both pools.
        - name: cpu-gpu-sim-alt
          instance_type: n2d-standard-16
          min_nodes: 0
          max_nodes: 49
          market_type: SPOT
          resources:
            simulated_gpu: 8

    # ---------- AWS EKS K8S us-east-2: REMOVED 2026-11-09, pending infra ----------
    # Attempted with this rollout, never came up: the staging EKS node group
    # backing the 8CPU-32GB pods has ~20 GiB ephemeral storage and the 7.8 GB
    # cu128 nightly image cannot unpack ("no space left on device" extracting
    # cuda-12.8 layers) -> repeated ImagePullBackOff -> kubelet disk-pressure
    # eviction "low on resource: ephemeral-storage" -> instance terminated ->
    # relaunched, in a loop until the version is abandoned.
    # Infra ask in flight: node-group root volume >= 100 GiB. Re-add then:
    #   - cloud_resource: k8s-aws-us-east-2
    #     head_node: {instance_type: 4CPU-16GB, resources: {CPU: 0}}
    #     worker_nodes:
    #       - {name: cpu-general, instance_type: 8CPU-32GB, min_nodes: 0, max_nodes: 49}
    #       - {name: cpu-gpu-sim, instance_type: 8CPU-32GB, min_nodes: 0,
    #          max_nodes: 25, resources: {simulated_gpu: 8}}
    #       - {name: cpu-gpu-sim-od, instance_type: 8CPU-32GB, min_nodes: 3,
    #          max_nodes: 3, resources: {simulated_gpu: 8}}   # 3 pods = 24 allocatable
    #          CPU for the 41 baseline replicas (0.5 CPU each) and 24 sim slots;
    #          no market_type/advanced_instance_config on K8S; no alt pool (no
    #          market choice there); head-FT off (no redis_endpoint on this resource)
    # ...and add k8s-aws-us-east-2: 1 to traffic_policy.static.weights below.

# Multi-resource traffic split, 75/25 (AWS/GCP). Capacity follows traffic:
# each resource ends up with roughly its share of replicas once apps scale
# to demand. Weights are relative integers >= 1 covering every resource.
# - A deploy WITHOUT this key starts the new version equal-split.
# - In-place updates ignore this field: each version keeps its own policy.
# - k8s-aws-us-east-2 rejoins with weight 1 once the EKS node disk is fixed
#   (recipe in compute_config.configs above) -> back to 3:1:1.
# Retune live without redeploying:
#   anyscale service update-traffic-policy -n serve-validation --type static \
#     --weight vm-aws-us-west-2=3 --weight vm-gcp-us-east4=1
traffic_policy:
  type: static
  static:
    weights:
      vm-aws-us-west-2: 3
      vm-gcp-us-east4: 1

# Omit http_options.host/port and grpc_options.port — set by Anyscale.
http_options:
  # 180 -> 26. Sits above the request ceiling (stream-chat, 2-15s) and below
  # RAY_SERVE_HAPROXY_TIMEOUT_SERVER_S (28) so an overrun is a clean replica 408
  # rather than a generic HAProxy 500. The platform Envoy/ALB has its own
  # ~300s timeout that this YAML cannot override.
  request_timeout_s: 26
  keep_alive_timeout_s: 3600 # (should be >= to AWS ALB idle timeout)

grpc_options:
  grpc_servicer_functions:
    - ray.serve.generated.serve_pb2_grpc.add_UserDefinedServiceServicer_to_server

# Optional: enable actor_options(... simulated_gpu=True) in code when this group is used.
# Default in common.py is off so CPU-only clusters still schedule.
env_vars:
  RAY_SERVE_SIMULATED_GPU: "1"

  # ray serve forward looking features flags
  # we should marinate these here before recommending them to customers
  # RAY_SERVE_RUN_USER_CODE_IN_SEPARATE_THREAD: "0"
  # RAY_SERVE_RUN_ROUTER_IN_SEPARATE_LOOP: "0"
  RAY_SERVE_USE_GRPC_BY_DEFAULT: "1"
  # heavy-payload returns up to 50 MB; the proxy↔replica gRPC channel uses
  # this limit (default 4 MiB) and was rejecting responses with
  # StatusCode.RESOURCE_EXHAUSTED. 64 MiB covers the 50 MB worst case with margin.
  RAY_SERVE_REPLICA_GRPC_MAX_MESSAGE_LENGTH: "2147483647"
  RAY_SERVE_ENABLE_HA_PROXY: "1"
  RAY_SERVE_HAPROXY_BALANCE_ALGORITHM: "random(2)"
  RAY_SERVE_AGGREGATE_METRICS_AT_CONTROLLER: "1"
  RAY_SERVE_FAIL_ON_RANK_ERROR: "1"
  RAY_SERVE_LOG_CLIENT_ADDRESS: "1"
  RAY_SERVE_RUN_SYNC_IN_THREADPOOL: "1"
  # RAY_SERVE_HAPROXY_RELOAD_TIMEOUT_S: "60"
  RAY_SERVE_HAPROXY_RETRIES: "1000" # check this later ----

  # 400 -> 30. Lifetime of a soft-stopping HAProxy worker, so also the
  # stale-routing window. At 30 it equals RAY_SERVE_DIRECT_INGRESS_MIN_DRAINING_PERIOD_S,
  # and the whole retirement fits inside AWS's 120s notice. Do not set it below
  # the longest request -- hard-stop SIGKILLs whatever is still running.
  RAY_SERVE_HAPROXY_HARD_STOP_AFTER_S: "30"
  # 240 -> 28. Above the request ceiling (stream-chat, 2-15s) and at/below
  # hard-stop, so HAProxy never waits longer than the worker will exist.
  RAY_SERVE_HAPROXY_TIMEOUT_SERVER_S: "28"
  RAY_SERVE_HAPROXY_TIMEOUT_CONNECT_S: "5"
  RAY_SERVE_PORT_QUARANTINE_S: "600"
  RAY_SERVE_QUEUE_LENGTH_RESPONSE_DEADLINE_S: "0.5"
  # 0.5 -> 3 (2026-08-21). At 0.5 the fleet reloaded ~15x/min and the churn
  # showed up as client-side ~100ms P99 blips on the fastest endpoints while
  # proxy-level P99 stayed 8-10ms. 3s coalescing removed them; two clean runs.
  RAY_SERVE_HAPROXY_BROADCAST_COALESCE_S: "3"
  ANYSCALE_FREEZE_GC_ON_STARTUP: "1"
  RAY_SERVE_ENABLE_HAPROXY_OPTIMIZED_CONFIG: "1"
  # Mark a backend down as soon as HAProxy observes a failed connection to it,
  # rather than waiting for the next health check. Shortens the window in which
  # a departing node keeps receiving traffic.
  RAY_SERVE_HAPROXY_OBSERVE_MARK_DOWN_ENABLED: "1"

  # Faster scale-from-zero for composition chains. These gate how quickly the
  # controller sees queued requests for a 0-replica deployment (default 10s),
  # which dominates per-hop cold start. Pair with upscale_delay_s=0 in config.py.
  RAY_SERVE_HANDLE_AUTOSCALING_METRIC_PUSH_INTERVAL_S: "2"
  RAY_SERVE_REPLICA_AUTOSCALING_METRIC_PUSH_INTERVAL_S: "2"

  # Default buckets + 180000: the scale-up convergence SLO was raised to 180s
  # (2026-07-20) and the "Replica startups slower than 180s SLO" Grafana alert
  # needs an exact 180000ms bucket boundary to count violations without
  # interpolation (default buckets jump 120000 -> 240000). The alert query
  # falls back to the 120000 bucket until this rollout lands.
  RAY_SERVE_REPLICA_STARTUP_SHUTDOWN_LATENCY_BUCKETS_MS: "5,20,50,100,250,500,1000,2000,5000,10000,20000,30000,60000,120000,180000,240000"

  # Default buckets + 15000/30000/70000/90000. The old 130000/150000 bounds
  # existed for long-runner's 120s requests (RCA 2026-08-03); with that app off,
  # nothing reaches them. 15000/30000 make stream-chat's 2-15s streams measurable.
  #
  # ACTION REQUIRED: the Grafana rule and the Notion table still carry
  # long-runner's 130s SLO. Retire it along with the app.
  RAY_SERVE_REQUEST_LATENCY_BUCKETS_MS: "1,2,5,10,20,50,100,200,300,400,500,1000,2000,5000,10000,15000,30000,60000,70000,90000,120000,300000,600000"

  # RAY_SERVE_USE_COMPACT_SCHEDULING_STRATEGY: "0"

applications:
  - name: echo-baseline
    route_prefix: /echo
    import_path: serve_validation.apps.echo_baseline:app

  - name: nlp-chain
    route_prefix: /nlp-chain
    import_path: serve_validation.apps.nlp_chain:app

  - name: batch-infer
    route_prefix: /batch-infer
    import_path: serve_validation.apps.batch_infer:app

  - name: stream-chat
    route_prefix: /stream-chat
    import_path: serve_validation.apps.stream_chat:app

  - name: mux-model-router
    route_prefix: /mux
    import_path: serve_validation.apps.mux_model_router:app

  - name: image-dag
    route_prefix: /image-dag
    import_path: serve_validation.apps.image_dag:app

  - name: cpu-fanout
    route_prefix: /cpu-fanout
    import_path: serve_validation.apps.cpu_fanout:app

  - name: mixed-preprocess
    route_prefix: /mixed-preprocess
    import_path: serve_validation.apps.mixed_preprocess:app

  - name: heavy-payload
    route_prefix: /heavy-payload
    import_path: serve_validation.apps.heavy_payload:app

  # long-runner disabled 2026-08-31: the only app held long enough to be caught
  # mid-flight by hard-stop-after (27 such 500s in the 18:31 run). Costs us
  # coverage of long requests. Re-enable together with traffic_model.py,
  # locustfile.py and smoke_all.py -- the route 404s if any of them lags.
  # - name: long-runner
  #   route_prefix: /long-runner
  #   import_path: serve_validation.apps.long_runner:app

  - name: highscale-stress
    route_prefix: /highscale
    import_path: serve_validation.apps.highscale_stress:app

  - name: grpc-canary
    route_prefix: /grpc-canary
    import_path: serve_validation.apps.grpc_canary:app
