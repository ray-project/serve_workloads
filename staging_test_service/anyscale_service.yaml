# Anyscale Service — deploy with:
#   anyscale service deploy -f anyscale_service.yaml -w .
# Override image: anyscale service deploy -f anyscale_service.yaml --image-uri other/image:tag -w .
# The image must resolve to a Cluster Environment build in your org (see console or `anyscale cluster-env list`).
# upgrade_service.py defaults --working-dir to the current directory.
#
# Schema: anyscale.service.models.ServiceConfig (CLI 0.26.x). Ray Serve options that
# conflict with Anyscale-managed networking are omitted (host/port/proxy_location).

name: serve-validation

project: serve-testing

image_uri: anyscale/ray:turbonightly-py310-cu128

working_dir: .

requirements: requirements.txt

compute_config:
  cloud: anyscale_v2_default_cloud
  head_node:
    # m7i.xlarge (4 vCPU / 16 GiB) per design §10.3 cost lever: measured head peak
    # (2026-08-02 run, 78 nodes) was 32% CPU / 3.2 GiB RSS on m7i.2xlarge. The
    # 75%/90% head-memory alerts guard this. Revert to m7i.2xlarge before genuine
    # 200-node / 4,096-replica full-scale runs.
    instance_type: m7i.xlarge
    # No schedulable CPU on head — Serve replicas and tasks go to workers only (design.md §3.1).
    resources:
      CPU: 0
    advanced_instance_config:
      TagSpecifications:
        - ResourceType: instance
          Tags:
            - Key: ttl-hours
              Value: "8760"  # 1 year
  # Deliberately no ttl-hours on the worker groups: worker loss is tolerated
  # (Risk 7 below) and these two scale 0-150 and 0-49, so exempting them would
  # take a ~199-node fleet out of cost GC and leave any leaked worker running
  # forever. They live well under the reaper's 12h floor at min_nodes: 0.
  worker_nodes:
    # c6i.4xlarge (16 vCPU / 32 GiB, $0.68/h) replaces m5.4xlarge (16 vCPU /
    # 64 GiB, $0.768/h) — 2026-08-21 right-sizing: measured worker memory peak
    # across 24h incl. three load tests was 5.1 GiB (8% of 64), so RAM was the
    # wasted dimension; same core count keeps replica packing identical, and
    # c6i's Ice Lake cores are newer than m5's Skylake. -11.5% on every
    # worker-hour (~-$175/mo at current cadence).
    - name: cpu-general
      instance_type: c6i.4xlarge
      min_nodes: 0
      max_nodes: 150
      # ON_DEMAND on main. design §3.1/§11 priced workers as spot and Risk 7
      # treats interruptions as acceptable in principle, but a reclaim currently
      # costs load-test integrity: node retirement does not reliably complete
      # inside AWS's 120s notice, so a preemption mid-run produces
      # client-visible failures indistinguishable from a Serve regression --
      # the one thing this service exists to detect. Spot stays on a branch
      # until the retirement path fits the notice.
      market_type: ON_DEMAND
    - name: cpu-gpu-sim
      instance_type: c6i.4xlarge
      min_nodes: 0
      max_nodes: 49
      market_type: ON_DEMAND  # see cpu-general note
      # Expose simulated_gpu on this group (logical resources on the node).
      resources:
        simulated_gpu: 8

# Omit http_options.host/port and grpc_options.port — set by Anyscale.
http_options:
  # Ray Serve proxy → replica timeout. Sized for long-runner (sleeps up to 125s,
  # design SLO P99 < 130s). Note: the Anyscale platform Envoy/ALB has its own
  # idle/request timeout (~300s observed) that this YAML cannot override; for
  # caps above 300s, escalate to the Anyscale platform team.
  request_timeout_s: 180
  keep_alive_timeout_s: 3600 # (should be >= to AWS ALB idle timeout)

grpc_options:
  grpc_servicer_functions:
    - ray.serve.generated.serve_pb2_grpc.add_UserDefinedServiceServicer_to_server

# Optional: enable actor_options(... simulated_gpu=True) in code when this group is used.
# Default in common.py is off so CPU-only clusters still schedule.
env_vars:
  RAY_SERVE_SIMULATED_GPU: "1"

  # ray serve forward looking features flags
  # we should marinate these here before recommending them to customers
  # RAY_SERVE_RUN_USER_CODE_IN_SEPARATE_THREAD: "0"
  # RAY_SERVE_RUN_ROUTER_IN_SEPARATE_LOOP: "0"
  RAY_SERVE_USE_GRPC_BY_DEFAULT: "1"
  # heavy-payload returns up to 50 MB; the proxy↔replica gRPC channel uses
  # this limit (default 4 MiB) and was rejecting responses with
  # StatusCode.RESOURCE_EXHAUSTED. 64 MiB covers the 50 MB worst case with margin.
  RAY_SERVE_REPLICA_GRPC_MAX_MESSAGE_LENGTH: "2147483647"
  RAY_SERVE_ENABLE_HA_PROXY: "1"
  RAY_SERVE_HAPROXY_BALANCE_ALGORITHM: "random(2)"
  RAY_SERVE_AGGREGATE_METRICS_AT_CONTROLLER: "1"
  RAY_SERVE_FAIL_ON_RANK_ERROR: "1"
  RAY_SERVE_LOG_CLIENT_ADDRESS: "1"
  RAY_SERVE_RUN_SYNC_IN_THREADPOOL: "1"
  # RAY_SERVE_HAPROXY_RELOAD_TIMEOUT_S: "60"
  RAY_SERVE_HAPROXY_RETRIES: "1000" # check this later ----

  RAY_SERVE_HAPROXY_HARD_STOP_AFTER_S: "400"
  RAY_SERVE_HAPROXY_TIMEOUT_SERVER_S: "240"
  RAY_SERVE_HAPROXY_TIMEOUT_CONNECT_S: "5"
  RAY_SERVE_PORT_QUARANTINE_S: "600"
  RAY_SERVE_QUEUE_LENGTH_RESPONSE_DEADLINE_S: "0.5"
  # 0.5 -> 3 (2026-08-21). At 0.5 the fleet reloaded ~15x/min and the churn
  # showed up as client-side ~100ms P99 blips on the fastest endpoints while
  # proxy-level P99 stayed 8-10ms. 3s coalescing removed them; two clean runs.
  RAY_SERVE_HAPROXY_BROADCAST_COALESCE_S: "3"
  ANYSCALE_FREEZE_GC_ON_STARTUP: "1"
  RAY_SERVE_ENABLE_HAPROXY_OPTIMIZED_CONFIG: "1"
  # Mark a backend down as soon as HAProxy observes a failed connection to it,
  # rather than waiting for the next health check. Shortens the window in which
  # a departing node keeps receiving traffic.
  RAY_SERVE_HAPROXY_OBSERVE_MARK_DOWN_ENABLED: "1"

  # Faster scale-from-zero for composition chains. These gate how quickly the
  # controller sees queued requests for a 0-replica deployment (default 10s),
  # which dominates per-hop cold start. Pair with upscale_delay_s=0 in config.py.
  RAY_SERVE_HANDLE_AUTOSCALING_METRIC_PUSH_INTERVAL_S: "2"
  RAY_SERVE_REPLICA_AUTOSCALING_METRIC_PUSH_INTERVAL_S: "2"

  # Default buckets + 180000: the scale-up convergence SLO was raised to 180s
  # (2026-07-20) and the "Replica startups slower than 180s SLO" Grafana alert
  # needs an exact 180000ms bucket boundary to count violations without
  # interpolation (default buckets jump 120000 -> 240000). The alert query
  # falls back to the 120000 bucket until this rollout lands.
  RAY_SERVE_REPLICA_STARTUP_SHUTDOWN_LATENCY_BUCKETS_MS: "5,20,50,100,250,500,1000,2000,5000,10000,20000,30000,60000,120000,180000,240000"

  # Default buckets + 15000, 30000, 130000, 150000: feeds
  # serve_deployment_processing_latency_ms (replica.py), which the
  # "Per-app P99 latency over design target" Grafana alert quantiles. The
  # default buckets jump 120000 -> 300000, so long-runner's 130s SLO was
  # unmeasurable: any single ~120.0s request (the pinger's own max draw,
  # P = 0.05/90 per request) interpolated P99 to ~282s and fired a false
  # "2.17x over target" alert ~0.7x/day (RCA 2026-08-03). With a 130000
  # bound, 120.x s requests interpolate inside (120s,130s] -> ratio <= 1.0
  # (silent); only genuine >130s P99 fires. 150000 (= pinger client timeout)
  # keeps the fired value honest instead of interpolating into the 130->300
  # gap. 15000/30000 make stream-chat's designed 2-30s streams measurable
  # (rule annotation's documented 10s->60s blind spot; its divisor can drop
  # from the 60001 hack to 30001 once this lands).
  RAY_SERVE_REQUEST_LATENCY_BUCKETS_MS: "1,2,5,10,20,50,100,200,300,400,500,1000,2000,5000,10000,15000,30000,60000,120000,130000,150000,300000,600000"

  RAY_SERVE_USE_COMPACT_SCHEDULING_STRATEGY: "0"

applications:
  - name: echo-baseline
    route_prefix: /echo
    import_path: serve_validation.apps.echo_baseline:app

  - name: nlp-chain
    route_prefix: /nlp-chain
    import_path: serve_validation.apps.nlp_chain:app

  - name: batch-infer
    route_prefix: /batch-infer
    import_path: serve_validation.apps.batch_infer:app

  - name: stream-chat
    route_prefix: /stream-chat
    import_path: serve_validation.apps.stream_chat:app

  - name: mux-model-router
    route_prefix: /mux
    import_path: serve_validation.apps.mux_model_router:app

  - name: image-dag
    route_prefix: /image-dag
    import_path: serve_validation.apps.image_dag:app

  - name: cpu-fanout
    route_prefix: /cpu-fanout
    import_path: serve_validation.apps.cpu_fanout:app

  - name: mixed-preprocess
    route_prefix: /mixed-preprocess
    import_path: serve_validation.apps.mixed_preprocess:app

  - name: heavy-payload
    route_prefix: /heavy-payload
    import_path: serve_validation.apps.heavy_payload:app

  - name: long-runner
    route_prefix: /long-runner
    import_path: serve_validation.apps.long_runner:app

  - name: highscale-stress
    route_prefix: /highscale
    import_path: serve_validation.apps.highscale_stress:app

  - name: grpc-canary
    route_prefix: /grpc-canary
    import_path: serve_validation.apps.grpc_canary:app
